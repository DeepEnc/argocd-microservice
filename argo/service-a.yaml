apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: deepenc/service-a
    argocd-image-updater.argoproj.io/service-a.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-commit-user: Argo Image Updater
    argocd-image-updater.argoproj.io/git-commit-email: sunilojha525@gmail.com
spec:
  project: default
  source:
    repoURL: "https://github.com/DeepEnc/argocd-microservice"
    targetRevision: "0.1-develop"
    path: service-a/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
