name: CI - Build & Push Docker Images

on:
  push:
    branches:
      - 0.1-develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get latest semantic version tag from Docker Hub
        id: get_version
        run: |
          IMAGE_NAME="deepenc/${{ matrix.service }}"
          LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -Vr | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$LATEST_TAG"
          patch=$((patch+1))
          NEW_TAG="$major.$minor.$patch"

          echo "New tag for $IMAGE_NAME: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="deepenc/${{ matrix.service }}"
          docker build -t "$IMAGE_NAME:${NEW_TAG}" "./${{ matrix.service }}"
          docker push "$IMAGE_NAME:${NEW_TAG}"
