name: CI - Build & Push Docker Images

on:
  push:
    branches:
      - 0.1-develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: set-services
        run: |
          # Get all changed files in service-a or service-b
          CHANGED_SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^service-[ab]/' \
            | grep -v '/k8s/kustomization.yaml$' \
            | cut -d/ -f1 | sort -u)

          if [ -z "$CHANGED_SERVICES" ]; then
            echo "No service code changes detected."
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            JSON_SERVICES=$(echo "$CHANGED_SERVICES" | jq -R -s -c 'split("\n")[:-1]')
            echo "Changed services: $JSON_SERVICES"
            echo "services=$JSON_SERVICES" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.services != '[]' && !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get latest semantic version tag from Docker Hub
        id: get_version
        run: |
          IMAGE_NAME="deepenc/${{ matrix.service }}"
          LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -Vr | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$LATEST_TAG"
          patch=$((patch+1))
          NEW_TAG="$major.$minor.$patch"

          echo "New tag for $IMAGE_NAME: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="deepenc/${{ matrix.service }}"
          docker build -t "$IMAGE_NAME:${NEW_TAG}" "./${{ matrix.service }}"
          docker push "$IMAGE_NAME:${NEW_TAG}"
